name: JavaScript and TypeScript tests
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true
      working-directory:
        type: string
        default: .
permissions:
  contents: read
jobs:
  tests:
    name: JavaScript and TypeScript tests
    uses: ./.github/workflows/npm-build-publish.yml
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}
      test-script: test
      build-script: ''
      publish: false
