name: JavaScript and TypeScript tests
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true
      working-directory:
        type: string
        default: .
      test-script:
        type: string
        default: test
      build-script:
        type: string
        default: ''
      repository:
        description: Source repository, defaults to the caller
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js toolchain version
        type: string
        required: true
      working-directory:
        type: string
        default: .
      test-script:
        type: string
        default: test
      build-script:
        description: Optional build script after tests
        type: string
        default: ''
      repository:
        description: Public source repository for this standalone run
        type: string
        required: true
permissions:
  contents: read
jobs:
  tests:
    name: JavaScript and TypeScript tests
    uses: ./.github/workflows/npm-build-publish.yml
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}
      test-script: ${{ inputs.test-script }}
      build-script: ${{ inputs.build-script }}
      repository: ${{ inputs.repository }}
      publish: false
