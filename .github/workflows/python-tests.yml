name: Python tests
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: true
      test-command:
        type: string
        required: true
      requirements-file:
        type: string
        default: ''
      cache-dependency-path:
        type: string
        default: ''
      after-test-command:
        description: Additional checks run even when the primary checks fail
        type: string
        default: ''
      repository:
        description: Source repository, defaults to the caller
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version or newline-separated supported versions
        type: string
        required: true
      test-command:
        description: Repository test or validation command
        type: string
        required: true
      requirements-file:
        description: Optional pip requirements file
        type: string
        default: ''
      cache-dependency-path:
        description: Optional pip cache dependency paths
        type: string
        default: ''
      after-test-command:
        description: Additional checks run even when the primary checks fail
        type: string
        default: ''
      repository:
        description: Public source repository for this standalone run
        type: string
        required: true
permissions:
  contents: read
jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.requirements-file != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path || inputs.requirements-file }}
      - name: Install test dependencies
        if: inputs.requirements-file != ''
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: python -m pip install --requirement "$REQUIREMENTS_FILE"
      - name: Run Python tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash --noprofile --norc -e -o pipefail -c "$TEST_COMMAND"
      - name: Run additional checks
        if: ${{ !cancelled() && inputs.after-test-command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.after-test-command }}
        run: bash --noprofile --norc -e -o pipefail -c "$TEST_COMMAND"
