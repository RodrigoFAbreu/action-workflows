name: Python tests
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: true
      working-directory:
        type: string
        default: .
      test-directory:
        type: string
        default: tests
      test-pattern:
        type: string
        default: test*.py
      top-level-directory:
        description: Optional unittest import root, relative to the working directory
        type: string
        default: ''
      requirements-file:
        type: string
        default: ''
      package-directory:
        description: Optional local Python package to install before testing
        type: string
        default: ''
      cache-dependency-path:
        type: string
        default: ''
      # Retain these two inputs while existing main-branch callers migrate.
      test-command:
        description: Deprecated migration input, use test-directory
        type: string
        default: ''
      after-test-command:
        description: Deprecated migration input, move custom validation to caller jobs
        type: string
        default: ''
permissions:
  contents: read
jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.requirements-file != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/{1}', inputs.working-directory, inputs.requirements-file) }}
      - name: Install test dependencies
        if: inputs.requirements-file != ''
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: python -m pip install --requirement "$REQUIREMENTS_FILE"
      - name: Install local package
        if: inputs.package-directory != ''
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: python -m pip install "$PACKAGE_DIRECTORY"
      - name: Run Python tests
        if: inputs.test-command == ''
        env:
          TEST_DIRECTORY: ${{ inputs.test-directory }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
          TOP_LEVEL_DIRECTORY: ${{ inputs.top-level-directory }}
        run: |
          arguments=(--start-directory "$TEST_DIRECTORY" --pattern "$TEST_PATTERN" --verbose)
          if [ -n "$TOP_LEVEL_DIRECTORY" ]; then
            arguments+=(--top-level-directory "$TOP_LEVEL_DIRECTORY")
          fi
          python -m unittest discover "${arguments[@]}"
      - name: Run legacy caller tests during migration
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash --noprofile --norc -e -o pipefail -c "$TEST_COMMAND"
      - name: Run legacy additional validation during migration
        if: ${{ !cancelled() && inputs.after-test-command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.after-test-command }}
        run: bash --noprofile --norc -e -o pipefail -c "$TEST_COMMAND"
