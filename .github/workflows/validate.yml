name: Validate shared workflows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Workflow checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint workflows and shell commands
        run: |
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -color .github/workflows/*.yml
