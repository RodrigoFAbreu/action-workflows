name: Validate shared workflows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/python-tests.yml
    with:
      python-version: '3.12'
      test-command: python -m unittest discover -s tests -v
      after-test-command: |
        docker run --rm --volume "$PWD:/repo" --workdir /repo \
          rhysd/actionlint:1.7.12 -color .github/workflows/*.yml
  required:
    name: Workflow checks
    needs: tests
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success
