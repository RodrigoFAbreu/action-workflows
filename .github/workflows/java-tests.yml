name: Java tests
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: true
      working-directory:
        type: string
        default: .
      distribution:
        type: string
        default: temurin
permissions:
  contents: read
jobs:
  tests:
    name: Java tests
    uses: ./.github/workflows/java-build-publish.yml
    with:
      java-version: ${{ inputs.java-version }}
      working-directory: ${{ inputs.working-directory }}
      distribution: ${{ inputs.distribution }}
      publish: false
